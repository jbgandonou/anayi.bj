databases:
  - name: anayi-db
    plan: free
    databaseName: anayi_db
    user: anayi

services:
  - type: web
    name: anayi-backend
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anayi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: PORT
        value: 3000
